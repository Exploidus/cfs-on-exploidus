name: CI cFS Exploidus Port

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build and execute cFS Exploidus demo
        run: |
          chmod +x run_demo.sh
          ./run_demo.sh
